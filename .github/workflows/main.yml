name: Android CI Bionic

on:
  workflow_dispatch:
  push:
    branches: [ "main2" ]
  pull_request:
    branches: [ "main2" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew assembleDebug
      
    - name: Debug - Find APK location
      run: |
        echo "=== Searching for APK files ==="
        find . -name "*.apk" -type f
        echo "=== Checking app directory ==="
        ls -la app/build/outputs/ || echo "app/build/outputs not found"
        ls -la app/build/outputs/apk/ || echo "apk folder not found"
        
    - name: Upload APK - Option 1 (if in debug)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: aps3e-debug
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
        
    - name: Upload APK - Option 2 (search all)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: aps3e-all-apks
        path: "**/*.apk"
        if-no-files-found: warn
