name: Universal Build - aps3e

on:
  push:
    branches: [ "main2" ]
  pull_request:
    branches: [ "main2" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Detect build system
      id: detect
      run: |
        if [ -f "gradlew" ]; then
          echo "system=gradle" >> $GITHUB_OUTPUT
        elif [ -f "CMakeLists.txt" ]; then
          echo "system=cmake" >> $GITHUB_OUTPUT
        elif [ -f "Makefile" ]; then
          echo "system=make" >> $GITHUB_OUTPUT
        else
          echo "system=unknown" >> $GITHUB_OUTPUT
        fi

    - name: Setup Java (if Gradle)
      if: steps.detect.outputs.system == 'gradle'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      if: steps.detect.outputs.system == 'gradle'
      run: |
        chmod +x gradlew
        ./gradlew build

    - name: Install dependencies (if C++)
      if: steps.detect.outputs.system == 'cmake' || steps.detect.outputs.system == 'make'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libgl1-mesa-dev libglu1-mesa-dev

    - name: Build with CMake
      if: steps.detect.outputs.system == 'cmake'
      run: |
        mkdir -p build && cd build
        cmake .. && make -j$(nproc)

    - name: Build with Make
      if: steps.detect.outputs.system == 'make'
      run: |
        make -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aps3e-build
        path: |
          **/*.apk
          **/*.so
          **/bin/
          build/
