name: Android CI - Guaranteed APK

on:
  push:
    branches: [ "main2" ]
  pull_request:
    branches: [ "main2" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Clean and Build
      run: |
        ./gradlew clean
        ./gradlew assembleDebug
        
    - name: Locate APK file
      id: locate_apk
      run: |
        # البحث عن ملف APK
        APK_PATH=$(find app/build/outputs -name "*.apk" | head -n 1)
        
        if [ -n "$APK_PATH" ]; then
          echo "✅ Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          
          # عرض تفاصيل الملف
          ls -la "$APK_PATH"
          file "$APK_PATH"
        else
          echo "❌ No APK found!"
          
          # محاولة معرفة سبب المشكلة
          echo "=== Checking build variants ==="
          ./gradlew tasks | grep assemble
          
          echo "=== Build output directory ==="
          mkdir -p app/build/outputs/apk/debug/
          ls -la app/build/outputs/apk/debug/ || echo "Directory empty"
          
          exit 1
        fi
        
    - name: Upload APK
      if: steps.locate_apk.outputs.apk_path != ''
      uses: actions/upload-artifact@v4
      with:
        name: Winlator-APK
        path: ${{ steps.locate_apk.outputs.apk_path }}
        retention-days: 90
        
    - name: Upload all APKs as backup
      uses: actions/upload-artifact@v4
      with:
        name: all-apks-backup
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: warn
